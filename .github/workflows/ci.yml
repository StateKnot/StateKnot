name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Install Caddy configuration validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends caddy

      - name: Check formatting
        run: npm run format:check

      - name: Check deployment script syntax
        run: |
          bash -n scripts/bootstrap-tls.sh
          bash -n scripts/deploy.sh
          caddy validate --config deploy/Caddyfile --adapter caddyfile
          caddy fmt --overwrite deploy/Caddyfile
          git diff --exit-code -- deploy/Caddyfile

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Verify published runtime schemas
        run: |
          cmp ../crates/stateknot-runtime/schemas/graph-driver-event-1.0.0.json \
            public/schemas/runtime/graph-driver-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/graph-lifecycle-event-1.0.0.json \
            public/schemas/runtime/graph-lifecycle-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/agent-admission-event-1.0.0.json \
            public/schemas/runtime/agent-admission-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/agent-cancellation-event-1.0.0.json \
            public/schemas/runtime/agent-cancellation-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/invocation-execution-event-1.0.0.json \
            public/schemas/runtime/invocation-execution-event/1.0.0

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build website
        run: npm run build

      - name: Run browser and accessibility tests
        run: npm run test:e2e

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Validate workspace metadata
        run: cargo metadata --format-version 1 --locked --no-deps

  mcp-conformance:
    name: MCP Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: conformance/mcp-client/.nvmrc
          cache: npm
          cache-dependency-path: conformance/mcp-client/package-lock.json

      - name: Install pinned official MCP runner
        working-directory: conformance/mcp-client
        run: npm ci --ignore-scripts

      - name: Audit MCP runner dependencies
        working-directory: conformance/mcp-client
        run: npm audit --audit-level=high

      - name: Run frozen MCP client requirement set
        run: bash conformance/mcp-client/run-2026-07-28.sh

      - name: Run frozen MCP server requirement set
        run: bash conformance/mcp-server/run-2026-07-28.sh

  a2a-conformance:
    name: A2A 1.0 Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.25"
          enable-cache: false

      - name: Run frozen A2A 1.0 server profile
        run: bash conformance/a2a-server/run-1.0.sh

      - name: Upload A2A conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a2a-1.0-conformance-${{ github.run_id }}
          path: conformance/a2a-server/results/
          if-no-files-found: error
          retention-days: 30

  cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check and test workspace
        run: cargo test --workspace --all-targets --all-features --locked

  postgres:
    name: PostgreSQL (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "16"
            image: postgres@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
          - version: "17"
            image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: stateknot_test
          POSTGRES_PASSWORD: stateknot_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stateknot_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Run mandatory PostgreSQL integration tests
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        # The database tests intentionally share one migrated schema and serialize
        # at the test boundary. Individual stress cases still create their own
        # multi-threaded runtimes and concurrent database tasks.
        run: cargo test -p stateknot-store-postgres --test postgres --locked -- --test-threads=1

      - name: Run durable Graph Driver integration tests
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: cargo test -p stateknot-runtime --test postgres --locked -- --test-threads=1

      - name: Record process-kill qualification environment
        env:
          STATEKNOT_QUALIFICATION_POSTGRES_IMAGE: ${{ matrix.image }}
        run: |
          {
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            sha256sum Cargo.lock
            rustc -Vv
            uname -a
            lscpu
            free -b
            df -T .
            printenv STATEKNOT_QUALIFICATION_POSTGRES_IMAGE
          } | tee failure-close-process-environment.log

      - name: Qualify committed failure-close process-kill boundaries
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot-runtime --test postgres --locked -- \
            --exact child_admission::ownership::failure_close::process::failure_close_survives_os_kill_at_each_committed_drain_boundary \
            --nocapture --test-threads=1 | tee failure-close-process-qualification.log
          # Rust's test harness exits successfully even when a filter matches zero
          # tests. Require all six machine-readable checkpoints as well as exit 0.
          test "$(grep -c '^STATEKNOT_PROCESS_KILL_EVIDENCE=' failure-close-process-qualification.log)" = 6

      - name: Qualify commit loss and expired-fence takeover
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot-runtime --test postgres --locked -- \
            --exact child_admission::ownership::failure_close::commit_loss::failure_close_commit_loss_and_fence_takeover_are_recoverable \
            --nocapture --test-threads=1 | tee failure-close-commit-loss.log
          test "$(grep -c '^STATEKNOT_COMMIT_LOSS_EVIDENCE=' failure-close-commit-loss.log)" = 2

      - name: Upload process-kill qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-close-process-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            failure-close-process-*.log
            failure-close-commit-loss.log
          if-no-files-found: error
          retention-days: 30

      - name: Run durable protocol integration tests
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: cargo test -p stateknot-integrations --test mcp_durable --locked -- --test-threads=1

      - name: Qualify trusted SQL role profile
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot-runtime --test postgres --locked -- \
            --exact child_admission::ownership::failure_close::role_profile::trusted_sql_role_profile_enforces_privileges_and_runs_durable_work \
            --nocapture --test-threads=1 | tee trusted-role-profile-qualification.log
          test "$(grep -c '^STATEKNOT_ROLE_PROFILE_EVIDENCE=' trusted-role-profile-qualification.log)" = 1

      - name: Upload trusted SQL role evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-role-profile-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            trusted-role-profile-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Qualify MCP compute Worker isolation and recovery
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot --test mcp_compute --locked -- \
            --nocapture --test-threads=1 | tee mcp-compute-worker-qualification.log
          test "$(grep -c '^STATEKNOT_COMPUTE_WORKER_EVIDENCE=' mcp-compute-worker-qualification.log)" = 1

      - name: Upload MCP compute Worker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-compute-worker-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            mcp-compute-worker-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Run durable artifact storage integration tests
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: cargo test -p stateknot-artifact-store --test artifact_store --locked -- --test-threads=1

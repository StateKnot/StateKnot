name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Install Caddy configuration validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends caddy

      - name: Check formatting
        run: npm run format:check

      - name: Check deployment script syntax
        run: |
          bash -n scripts/bootstrap-tls.sh
          bash -n scripts/deploy.sh
          caddy validate --config deploy/Caddyfile --adapter caddyfile
          caddy fmt --overwrite deploy/Caddyfile
          git diff --exit-code -- deploy/Caddyfile

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Verify published runtime schemas
        run: |
          cmp ../crates/stateknot-runtime/schemas/graph-driver-event-1.0.0.json \
            public/schemas/runtime/graph-driver-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/graph-lifecycle-event-1.0.0.json \
            public/schemas/runtime/graph-lifecycle-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/agent-admission-event-1.0.0.json \
            public/schemas/runtime/agent-admission-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/agent-cancellation-event-1.0.0.json \
            public/schemas/runtime/agent-cancellation-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/invocation-execution-event-1.0.0.json \
            public/schemas/runtime/invocation-execution-event/1.0.0

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build website
        run: npm run build

      - name: Run browser and accessibility tests
        run: npm run test:e2e

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Validate workspace metadata
        run: cargo metadata --format-version 1 --locked --no-deps

  mcp-conformance:
    name: MCP Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: conformance/mcp-client/.nvmrc
          cache: npm
          cache-dependency-path: conformance/mcp-client/package-lock.json

      - name: Install pinned official MCP runner
        working-directory: conformance/mcp-client
        run: npm ci --ignore-scripts

      - name: Audit MCP runner dependencies
        working-directory: conformance/mcp-client
        run: npm audit --audit-level=high

      - name: Run frozen MCP client requirement set
        run: bash conformance/mcp-client/run-2026-07-28.sh

  cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check and test workspace
        run: cargo test --workspace --all-targets --all-features --locked

  postgres:
    name: PostgreSQL (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "16"
            image: postgres@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
          - version: "17"
            image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: stateknot_test
          POSTGRES_PASSWORD: stateknot_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stateknot_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Run mandatory PostgreSQL integration tests
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        # The database tests intentionally share one migrated schema and serialize
        # at the test boundary. Individual stress cases still create their own
        # multi-threaded runtimes and concurrent database tasks.
        run: cargo test -p stateknot-store-postgres --test postgres --locked -- --test-threads=1

      - name: Run durable Graph Driver integration tests
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: cargo test -p stateknot-runtime --test postgres --locked -- --test-threads=1

      - name: Run durable MCP integration tests
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: cargo test -p stateknot-integrations --test mcp_durable --locked -- --test-threads=1

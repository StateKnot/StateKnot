name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Install Caddy configuration validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends caddy

      - name: Check formatting
        run: npm run format:check

      - name: Check deployment script syntax
        run: |
          bash -n scripts/bootstrap-tls.sh
          bash -n scripts/deploy.sh
          caddy validate --config deploy/Caddyfile --adapter caddyfile
          caddy fmt --overwrite deploy/Caddyfile
          git diff --exit-code -- deploy/Caddyfile

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Verify published runtime schemas
        run: |
          cmp ../crates/stateknot-runtime/schemas/graph-driver-event-1.0.0.json \
            public/schemas/runtime/graph-driver-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/graph-lifecycle-event-1.0.0.json \
            public/schemas/runtime/graph-lifecycle-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/agent-admission-event-1.0.0.json \
            public/schemas/runtime/agent-admission-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/agent-policy-evidence-1.0.0.json \
            public/schemas/runtime/agent-policy-evidence/1.0.0
          cmp ../crates/stateknot-runtime/schemas/agent-cancellation-event-1.0.0.json \
            public/schemas/runtime/agent-cancellation-event/1.0.0
          cmp ../crates/stateknot-runtime/schemas/invocation-execution-event-1.0.0.json \
            public/schemas/runtime/invocation-execution-event/1.0.0

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build website
        run: npm run build

      - name: Run browser and accessibility tests
        run: npm run test:e2e

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Compile public core contract examples
        run: cargo check -p stateknot-core --examples --locked

      - name: Verify sealed Core compatibility fixture catalog
        run: cargo test -p stateknot-core --test fixture_catalog --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Validate workspace metadata
        run: cargo metadata --format-version 1 --locked --no-deps

  release-packages:
    name: Release packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Verify crates.io source lists and bootstrap archives
        run: ./scripts/verify-release.sh 0.1.0-alpha.1

  mcp-conformance:
    name: MCP Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: conformance/mcp-client/.nvmrc
          cache: npm
          cache-dependency-path: conformance/mcp-client/package-lock.json

      - name: Install pinned official MCP runner
        working-directory: conformance/mcp-client
        run: npm ci --ignore-scripts

      - name: Audit MCP runner dependencies
        working-directory: conformance/mcp-client
        run: npm audit --audit-level=high

      - name: Run frozen MCP client requirement set
        run: bash conformance/mcp-client/run-2026-07-28.sh

      - name: Run frozen MCP server requirement set
        run: bash conformance/mcp-server/run-2026-07-28.sh

  a2a-conformance:
    name: A2A 1.0 Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.25"
          enable-cache: false

      - name: Run frozen A2A 1.0 server profile
        run: bash conformance/a2a-server/run-1.0.sh

      - name: Upload A2A conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a2a-1.0-conformance-${{ github.run_id }}
          path: conformance/a2a-server/results/
          if-no-files-found: error
          retention-days: 30

  cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check and test workspace
        run: cargo test --workspace --all-targets --all-features --locked

  postgres:
    name: PostgreSQL (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "16"
            image: postgres@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
          - version: "17"
            image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: stateknot_test
          POSTGRES_PASSWORD: stateknot_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stateknot_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Run mandatory PostgreSQL integration tests
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        # The database tests intentionally share one migrated schema and serialize
        # at the test boundary. Individual stress cases still create their own
        # multi-threaded runtimes and concurrent database tasks.
        run: cargo test -p stateknot-store-postgres --test postgres --locked -- --test-threads=1

      - name: Run durable Graph Driver integration tests
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: cargo test -p stateknot-runtime --test postgres --locked -- --test-threads=1

      - name: Record process-kill qualification environment
        env:
          STATEKNOT_QUALIFICATION_POSTGRES_IMAGE: ${{ matrix.image }}
        run: |
          {
            git rev-parse HEAD
            git rev-parse 'HEAD^{tree}'
            sha256sum Cargo.lock
            rustc -Vv
            uname -a
            lscpu
            free -b
            df -T .
            printenv STATEKNOT_QUALIFICATION_POSTGRES_IMAGE
          } | tee failure-close-process-environment.log

      - name: Qualify committed failure-close process-kill boundaries
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot-runtime --test postgres --locked -- \
            --exact child_admission::ownership::failure_close::process::failure_close_survives_os_kill_at_each_committed_drain_boundary \
            --nocapture --test-threads=1 | tee failure-close-process-qualification.log
          # Rust's test harness exits successfully even when a filter matches zero
          # tests. Require all six machine-readable checkpoints as well as exit 0.
          test "$(grep -c '^STATEKNOT_PROCESS_KILL_EVIDENCE=' failure-close-process-qualification.log)" = 6

      - name: Qualify commit loss and expired-fence takeover
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot-runtime --test postgres --locked -- \
            --exact child_admission::ownership::failure_close::commit_loss::failure_close_commit_loss_and_fence_takeover_are_recoverable \
            --nocapture --test-threads=1 | tee failure-close-commit-loss.log
          test "$(grep -c '^STATEKNOT_COMMIT_LOSS_EVIDENCE=' failure-close-commit-loss.log)" = 2

      - name: Upload process-kill qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-close-process-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            failure-close-process-*.log
            failure-close-commit-loss.log
          if-no-files-found: error
          retention-days: 30

      - name: Run durable protocol integration tests
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot-integrations --test mcp_durable --locked -- \
            --nocapture --test-threads=1 | tee mcp-authorization-qualification.log
          test "$(grep -c '^STATEKNOT_MCP_AUTHORIZATION_EVIDENCE=' mcp-authorization-qualification.log)" = 2

      - name: Upload MCP call authorization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-authorization-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            mcp-authorization-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Qualify authenticated MCP result and known-error reconciliation
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot --test mcp_reconciliation --locked -- \
            --nocapture --test-threads=1 | tee mcp-reconciliation-qualification.log
          test "$(grep -c '^STATEKNOT_MCP_RECONCILIATION_EVIDENCE=' mcp-reconciliation-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_MCP_ERROR_RECONCILIATION_EVIDENCE=' mcp-reconciliation-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_MCP_ERROR_RECONCILIATION_RACE_EVIDENCE=' mcp-reconciliation-qualification.log)" = 1

      - name: Upload MCP outcome reconciliation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-reconciliation-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            mcp-reconciliation-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Qualify trusted SQL role profile
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot-runtime --test postgres --locked -- \
            --exact child_admission::ownership::failure_close::role_profile::trusted_sql_role_profile_enforces_privileges_and_runs_durable_work \
            --nocapture --test-threads=1 | tee trusted-role-profile-qualification.log
          test "$(grep -c '^STATEKNOT_ROLE_PROFILE_EVIDENCE=' trusted-role-profile-qualification.log)" = 1

      - name: Upload trusted SQL role evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-role-profile-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            trusted-role-profile-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Qualify MCP compute Worker isolation and recovery
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot --test mcp_compute --locked -- \
            --nocapture --test-threads=1 | tee mcp-compute-worker-qualification.log
          test "$(grep -c '^STATEKNOT_COMPUTE_WORKER_EVIDENCE=' mcp-compute-worker-qualification.log)" = 1

      - name: Upload MCP compute Worker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-compute-worker-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            mcp-compute-worker-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Qualify Agent HTTP ingress and lost-response recovery
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot --test agent_http --locked -- \
            --nocapture --test-threads=1 | tee agent-http-qualification.log
          test "$(grep -c '^STATEKNOT_AGENT_HTTP_EVIDENCE=' agent-http-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_AGENT_SSE_EVIDENCE=' agent-http-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_AGENT_SERVER_EVIDENCE=' agent-http-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_RESOURCE_POLICY_EVIDENCE=' agent-http-qualification.log)" = 1

      - name: Upload Agent HTTP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-http-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            agent-http-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Qualify owned durable scheduling Worker
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot --test agent_worker --locked -- \
            --nocapture --test-threads=1 --skip host:: --skip operations:: --skip qualification:: | tee agent-worker-qualification.log
          test "$(grep -c '^STATEKNOT_WORKER_EXECUTION_EVIDENCE=' agent-worker-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_WORKER_RECOVERY_EVIDENCE=' agent-worker-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_WORKER_FAILSTOP_EVIDENCE=' agent-worker-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_WORKER_FAIR_EVIDENCE=' agent-worker-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_WORKER_MAINTENANCE_EVIDENCE=' agent-worker-qualification.log)" = 1

      - name: Upload owned Worker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-worker-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            agent-worker-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Qualify co-located Agent host
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot --test agent_worker --locked host:: -- \
            --nocapture --test-threads=1 | tee agent-host-qualification.log
          for marker in ADMISSION STARTUP FAILURE DRAIN DROP; do
            test "$(grep -c "^STATEKNOT_HOST_${marker}_EVIDENCE=" agent-host-qualification.log)" = 1
          done

      - name: Upload co-located host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-host-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            agent-host-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Qualify protected host operations
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot --test agent_worker --locked operations:: -- \
            --nocapture --test-threads=1 | tee agent-operations-qualification.log
          for marker in AUTHORIZATION LIFECYCLE INPUT BOUNDS TRANSPORT; do
            test "$(grep -c "^STATEKNOT_OPERATIONS_${marker}_EVIDENCE=" agent-operations-qualification.log)" = 1
          done

      - name: Upload protected operations evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-operations-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            agent-operations-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Record reduced host qualification metadata
        env:
          STATEKNOT_QUALIFICATION_POSTGRES_IMAGE: ${{ matrix.image }}
          STATEKNOT_QUALIFICATION_POSTGRES_MAJOR: ${{ matrix.version }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          cargo_lock_sha256="$(sha256sum Cargo.lock | cut -d ' ' -f 1)"
          dataset_sha256="$(sha256sum docs/scenarios/README.md | cut -d ' ' -f 1)"
          configuration_sha256="$(printf '%s\n' \
            'profile=ci_reduced' \
            "postgres_image=${STATEKNOT_QUALIFICATION_POSTGRES_IMAGE}" \
            'synchronous_commit=on' \
            'topology=1,1,1,1' | sha256sum | cut -d ' ' -f 1)"
          logical_cpus="$(nproc)"
          cpu_model="$(lscpu | awk -F: '/Model name:/ { sub(/^[[:space:]]+/, "", $2); print $2; exit }')"
          test -n "$cpu_model"
          memory_bytes="$(awk '/MemTotal:/ { print $2 * 1024 }' /proc/meminfo | cut -d . -f 1)"
          kernel="$(uname -sr)"
          {
            echo "STATEKNOT_QUALIFICATION_SOURCE_COMMIT=${source_commit}"
            echo "STATEKNOT_QUALIFICATION_SOURCE_TREE=${source_tree}"
            echo "STATEKNOT_QUALIFICATION_CARGO_LOCK_SHA256=${cargo_lock_sha256}"
            echo "STATEKNOT_QUALIFICATION_DATASET_SHA256=${dataset_sha256}"
            echo "STATEKNOT_QUALIFICATION_CONFIGURATION_SHA256=${configuration_sha256}"
            echo "STATEKNOT_QUALIFICATION_LOGICAL_CPUS=${logical_cpus}"
            echo "STATEKNOT_QUALIFICATION_CPU_MODEL=${cpu_model}"
            echo "STATEKNOT_QUALIFICATION_MEMORY_BYTES=${memory_bytes}"
            echo "STATEKNOT_QUALIFICATION_KERNEL=${kernel}"
            echo "STATEKNOT_QUALIFICATION_POSTGRES_MAJOR=${STATEKNOT_QUALIFICATION_POSTGRES_MAJOR}"
          } | tee -a "$GITHUB_ENV" > reduced-host-qualification-environment.log
          printf '%s\n' "postgres_image=${STATEKNOT_QUALIFICATION_POSTGRES_IMAGE}" \
            >> reduced-host-qualification-environment.log

      - name: Run reduced host capacity and recovery qualification
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot --test agent_worker --locked -- \
            --exact qualification::postgres_reduced_host_qualification_emits_verified_non_release_evidence \
            --nocapture --test-threads=1 | tee reduced-host-qualification.log
          test "$(grep -c '^STATEKNOT_HOST_QUALIFICATION_REPORT=' reduced-host-qualification.log)" = 1

      - name: Upload reduced host qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reduced-host-qualification-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            reduced-host-qualification.log
            reduced-host-qualification-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Qualify owned Agent maintenance
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          cargo test -p stateknot-runtime --test postgres --locked \
            child_admission::ownership::failure_close::maintenance:: -- \
            --nocapture --test-threads=1 | tee agent-maintenance-qualification.log
          test "$(grep -c '^STATEKNOT_MAINTENANCE_EFFECTS_EVIDENCE=' agent-maintenance-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_MAINTENANCE_CURSOR_EVIDENCE=' agent-maintenance-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_MAINTENANCE_RECOVERY_EVIDENCE=' agent-maintenance-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_MAINTENANCE_LIFECYCLE_EVIDENCE=' agent-maintenance-qualification.log)" = 1

      - name: Upload owned maintenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-maintenance-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            agent-maintenance-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

      - name: Run durable artifact storage integration tests
        env:
          STATEKNOT_REQUIRE_POSTGRES_TESTS: "1"
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: cargo test -p stateknot-artifact-store --test artifact_store --locked -- --test-threads=1

      - name: Qualify real TLS identity, rotation, revocation and ingress
        env:
          STATEKNOT_TEST_DATABASE_URL: postgres://postgres:stateknot_test_password@127.0.0.1:5432/stateknot_test
        run: |
          set -o pipefail
          bash conformance/agent-identity/run.sh | tee agent-identity-qualification.log
          test "$(grep -c '^STATEKNOT_IDENTITY_EVIDENCE=' agent-identity-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_HOST_IDENTITY_EVIDENCE=' agent-identity-qualification.log)" = 1
          test "$(grep -c '^STATEKNOT_OPERATIONS_IDENTITY_EVIDENCE=' agent-identity-qualification.log)" = 1

      - name: Upload real identity qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-identity-postgres-${{ matrix.version }}-${{ github.run_id }}
          path: |
            agent-identity-qualification.log
            failure-close-process-environment.log
          if-no-files-found: error
          retention-days: 30

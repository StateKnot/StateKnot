name: crates.io release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Install the supported Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Resolve the exact release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tag must be v<semver>" >&2; exit 64 ;;
          esac
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify distributable archives
        run: ./scripts/verify-release.sh "${{ steps.release.outputs.version }}"

  publish:
    name: Publish crates.io packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Install the supported Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Exchange GitHub OIDC for a short-lived crates.io token
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish in dependency order and verify exact archives
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: ./scripts/publish-release.sh "${{ needs.verify.outputs.version }}"

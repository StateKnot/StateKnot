server {
    listen 80;
    listen [::]:80;
    server_name 49.232.33.76;

    root /var/www/stateknot/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/stateknot.access.log;
    error_log /var/log/nginx/stateknot.error.log warn;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        try_files /healthz.txt =503;
    }

    location = /healthz.txt {
        internal;
    }

    location /_astro/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}

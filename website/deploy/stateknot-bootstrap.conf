# This HTTP-only configuration exists solely to obtain the first certificate.
# The normal deployment replaces it with stateknot.conf after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name stknot.com www.stknot.com 49.232.33.76;

    root /var/www/stateknot/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/stateknot.access.log;
    error_log /var/log/nginx/stateknot.error.log warn;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        alias /var/www/stateknot/current/healthz.txt;
        default_type text/plain;
        expires -1;
    }

    location = /healthz.txt {
        return 404;
    }

    location /_astro/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}

[workspace]
members = [
    "crates/stateknot",
    "crates/stateknot-core",
    "crates/stateknot-integrations",
    "crates/stateknot-runtime",
    "crates/stateknot-store-postgres",
]
resolver = "3"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
fluent-uri = { version = "0.4.1", default-features = false, features = ["alloc"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
language-tags = "0.3.2"
mime = "0.3.17"
jsonschema = { version = "=0.52.1", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
reqwest = { version = "=0.12.28", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "stream",
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
sha2 = { version = "0.11.0", default-features = false }
sqlx-core = { version = "=0.8.6", default-features = false, features = [
    "_rt-tokio",
    "_tls-rustls-ring-native-roots",
    "chrono",
    "migrate",
    "uuid",
] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = [
    "chrono",
    "migrate",
    "uuid",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
uuid = { version = "1.26.0", features = ["v7"] }
zeroize = "1.8.2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["StateKnot contributors"]
license = "Apache-2.0"
repository = "https://github.com/StateKnot/StateKnot"
homepage = "https://github.com/StateKnot/StateKnot"
documentation = "https://docs.rs/stateknot"
readme = "README.md"
keywords = ["agent", "ai", "workflow", "mcp", "a2a"]
categories = ["asynchronous", "development-tools"]

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"

[workspace]
members = ["crates/stateknot", "crates/stateknot-core"]
resolver = "3"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
fluent-uri = { version = "0.4.1", default-features = false, features = ["alloc"] }
language-tags = "0.3.2"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v7"] }

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["StateKnot contributors"]
license = "Apache-2.0"
repository = "https://github.com/StateKnot/StateKnot"
homepage = "https://github.com/StateKnot/StateKnot"
documentation = "https://docs.rs/stateknot"
readme = "README.md"
keywords = ["agent", "ai", "workflow", "mcp", "a2a"]
categories = ["asynchronous", "development-tools"]

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"

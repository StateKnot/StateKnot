[package]
name = "stateknot-runtime"
description = "Executable registries and durable graph driving for StateKnot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/stateknot-runtime"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = ["crates-io"]

[package.metadata.docs.rs]
targets = []
rustdoc-args = ["-Dwarnings"]

[dependencies]
futures-core.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
stateknot-core = { version = "=0.1.0-alpha.1", path = "../stateknot-core" }
stateknot-store-postgres = { version = "=0.1.0-alpha.1", path = "../stateknot-store-postgres" }
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
proptest.workspace = true
sqlx-core.workspace = true
sqlx-postgres.workspace = true

[lints]
workspace = true

[package]
name = "stateknot-integrations"
description = "Bounded protocol and model-provider adapters for StateKnot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/stateknot-integrations"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = ["crates-io"]

[package.metadata.docs.rs]
targets = []
rustdoc-args = ["-Dwarnings"]

[features]
experimental-mcp-stdio-linux-owner = ["dep:nix", "dep:rustix", "tokio/io-util", "tokio/process"]

[[bin]]
name = "stateknot-mcp-stdio-owner"
required-features = ["experimental-mcp-stdio-linux-owner"]

[dependencies]
a2a.workspace = true
a2a-server.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-core.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
jsonschema.workspace = true
mime.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
sse-stream.workspace = true
stateknot-core = { version = "=0.1.0-alpha.1", path = "../stateknot-core" }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-service.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["poll", "process"], optional = true }
rustix = { version = "=1.1.4", features = ["fs", "net", "process", "time"], optional = true }

[dev-dependencies]
stateknot-runtime = { version = "=0.1.0-alpha.1", path = "../stateknot-runtime" }
stateknot-store-postgres = { version = "=0.1.0-alpha.1", path = "../stateknot-store-postgres" }
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true

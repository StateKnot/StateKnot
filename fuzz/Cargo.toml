[package]
name = "stateknot-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Isolate the nightly/dev-only fuzzer from the published/MSRV workspace.
[workspace]
members = ["."]
resolver = "3"

[dependencies]
jsonschema = { version = "=0.58.5", default-features = false }
libfuzzer-sys = "=0.4.13"
schemars = "=1.2.2"
serde = "=1.0.229"
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
stateknot-core = { version = "=0.1.0-alpha.1", path = "../crates/stateknot-core" }
stateknot-runtime = { version = "=0.1.0-alpha.1", path = "../crates/stateknot-runtime" }

[[bin]]
name = "bounded_json"
path = "fuzz_targets/bounded_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_readers"
path = "fuzz_targets/core_readers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema_registry"
path = "fuzz_targets/schema_registry.rs"
test = false
doc = false
bench = false
